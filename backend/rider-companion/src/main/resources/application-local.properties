spring.datasource.url=jdbc:h2:file:./data/rider_companion;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Codespaces forwards requests through a remote proxy; permit that proxy only in
# the local development profile so the embedded H2 console remains accessible.
spring.h2.console.settings.web-allow-others=true
