databaseChangeLog:
  - changeSet:
      id: 003-create-mobile-sessions
      author: rider-companion
      changes:
        - createTable:
            tableName: mobile_sessions
            columns:
              - column: { name: id, type: VARCHAR(36), constraints: { primaryKey: true, nullable: false } }
              - column: { name: user_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: refresh_secret_hash, type: VARCHAR(64), constraints: { nullable: false } }
              - column: { name: issued_at, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: expires_at, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: last_used_at, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: revoked_at, type: TIMESTAMP }
              - column: { name: device_name, type: VARCHAR(120) }
              - column: { name: platform, type: VARCHAR(30) }
              - column: { name: app_version, type: VARCHAR(40) }
        - addForeignKeyConstraint:
            baseTableName: mobile_sessions
            baseColumnNames: user_id
            constraintName: fk_mobile_sessions_user
            referencedTableName: users
            referencedColumnNames: id
        - createIndex:
            tableName: mobile_sessions
            indexName: ix_mobile_sessions_user_id
            columns:
              - column: { name: user_id }
